[client]
showErrorDetails = "none"
showErrorLinks = false
toolbarMode = "viewer"

[theme]
base = "light"
font = "sans serif"

[theme.light]
primaryColor = "#315EAA"
backgroundColor = "#F2F5F8"
secondaryBackgroundColor = "#EAF0F7"
textColor = "#1B304C"

[theme.dark]
primaryColor = "#91B8FF"
backgroundColor = "#101923"
secondaryBackgroundColor = "#172433"
textColor = "#E5EDF8"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
xsrfCookieSameSite = "strict"
maxUploadSize = 1
maxMessageSize = 50

[browser]
gatherUsageStats = false
