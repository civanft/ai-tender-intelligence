[client]
showErrorDetails = "none"
showErrorLinks = false
toolbarMode = "viewer"

[theme]
base = "light"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap, sans-serif"
baseFontSize = 15
baseRadius = "small"
buttonRadius = "small"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#1E4F8F"
backgroundColor = "#F6F6F4"
secondaryBackgroundColor = "#F1F1EE"
textColor = "#17191C"
borderColor = "#DCDCD8"
linkColor = "#1E4F8F"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F6F4"

[theme.dark]
primaryColor = "#8DB2E6"
backgroundColor = "#131518"
secondaryBackgroundColor = "#1E2226"
textColor = "#E6E7E9"
borderColor = "#30343A"
linkColor = "#8DB2E6"

[theme.dark.sidebar]
backgroundColor = "#1A1D21"
secondaryBackgroundColor = "#131518"

[server]
headless = true
enableStaticServing = true
enableCORS = true
enableXsrfProtection = true
xsrfCookieSameSite = "strict"
maxUploadSize = 1
maxMessageSize = 50

[browser]
gatherUsageStats = false
