name: Refresh TED tender data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 08 * * *"
      timezone: Europe/Istanbul

permissions:
  contents: read

concurrency:
  group: ted-data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the project
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          python -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r requirements.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Run the test suite
        run: pytest

      - name: Fetch the complete active TED snapshot
        run: python scripts/fetch_tenders.py --scope ACTIVE --page-size 250

      - name: Stage publication artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ted-publication
          path: |
            data/published/tenders.json
            data/published/tenders.parquet
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download validated publication
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ted-publication
          path: data/published

      - name: Commit publication changes
        id: publication
        shell: bash
        run: |
          git add -- data/published/tenders.json data/published/tenders.parquet
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh TED tender snapshot"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy the refreshed publication
        if: steps.publication.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run deploy-cloud-run.yml --ref main
          -f expected_sha="${{ steps.publication.outputs.sha }}"
