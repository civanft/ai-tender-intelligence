name: Refresh TED tender data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 08 * * *"
      timezone: Europe/Istanbul

permissions:
  contents: read

concurrency:
  group: ted-data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the project
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          python -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r requirements.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Run the test suite
        run: pytest

      - name: Fetch the complete active TED snapshot
        run: python scripts/fetch_tenders.py --scope ACTIVE --page-size 250

      - name: Stage publication artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ted-publication
          path: |
            data/published/tenders.json
            data/published/tenders.parquet
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download validated publication
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ted-publication
          path: data/published

      - name: Commit publication changes
        shell: bash
        run: |
          git add -- data/published/tenders.json data/published/tenders.parquet
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh TED tender snapshot"
          git push origin HEAD:main
