[build-system]
requires = ["setuptools>=83,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tender-intelligence"
version = "0.1.0"
description = "Explainable AI and data tender intelligence for Belgium, Italy, and Finland."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2.3,<4",
  "pyarrow>=18.0,<26",
  "plotly>=5.24.1,<8",
  "requests>=2.32.4,<3",
  "streamlit>=1.60,<2",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8.6,<2",
  "pip>=26.2,<27",
  "pip-audit>=2.10,<3",
  "pytest>=8.3,<10",
  "setuptools>=83,<85",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
