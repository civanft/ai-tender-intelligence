[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tender-intelligence"
version = "0.1.0"
description = "Explainable AI and data tender intelligence for Belgium, Italy, and Finland."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "pyarrow>=16.0",
  "plotly>=5.18",
  "requests>=2.31",
  "streamlit>=1.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
