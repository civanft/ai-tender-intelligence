[build-system]
requires = ["setuptools>=84.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "your-intelligence-coach"
version = "0.1.0"
description = "Tender Meridian: explainable AI and data procurement research across all 27 EU countries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2.3,<4",
  "pillow>=13.0.0,<14",
  "pyarrow>=18.0,<26",
  "plotly>=5.24.1,<8",
  "requests>=2.32.4,<3",
  "certifi>=2026.10.19",
  "streamlit>=1.60,<2",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8.6,<2",
  "filelock>=4.2.1",
  "pip>=26.2,<27",
  "pip-audit>=2.10,<3",
  "pytest>=8.3,<10",
  "setuptools>=84.1,<85",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
